version: 2

updates:
  # Keeps the SHA-pinned actions current. Dependabot understands the
  # `uses: owner/repo@<sha> # vN` convention and updates both parts.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /golden-paths/go-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: github-actions
    directory: /golden-paths/nodejs-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: github-actions
    directory: /golden-paths/python-fastapi-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: github-actions
    directory: /golden-paths/static-site/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: npm
    directory: /idp-portal
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      backstage:
        patterns: ['@backstage/*']
    ignore:
      # Backstage core requires React 18 and React Router 6.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: terraform
    directory: /infrastructure-modules
    schedule:
      interval: weekly
    labels: [dependencies, infrastructure]

  - package-ecosystem: gomod
    directory: /golden-paths/go-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: docker
    directory: /golden-paths/go-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: docker
    directory: /golden-paths/nodejs-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Standardized on Node 24 LTS.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /golden-paths/python-fastapi-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Standardized on Python 3.13.
      - dependency-name: 'python'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /golden-paths/static-site/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Golden path templates are pinned to vitest 2.x.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /golden-paths/nodejs-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Golden path templates are pinned to vitest 2.x.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
