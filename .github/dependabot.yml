version: 2

updates:
  # Keeps the SHA-pinned actions current. Dependabot understands the
  # `uses: owner/repo@<sha> # vN` convention and updates both parts.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, security]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /golden-paths/go-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    # catalog-info.yaml is a Backstage scaffolder template (unrendered
    # `{%- if %}` blocks), not valid standalone YAML. The updater scans every
    # yaml file under `directory` looking for `uses:` references, not just
    # .github/workflows, so it aborts the whole job on this file otherwise.
    exclude-paths:
      - catalog-info.yaml

  - package-ecosystem: github-actions
    directory: /golden-paths/nodejs-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    exclude-paths:
      - catalog-info.yaml

  - package-ecosystem: github-actions
    directory: /golden-paths/python-fastapi-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    exclude-paths:
      - catalog-info.yaml

  - package-ecosystem: github-actions
    directory: /golden-paths/static-site/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    exclude-paths:
      - catalog-info.yaml

  - package-ecosystem: npm
    directory: /idp-portal
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      backstage:
        patterns: ['@backstage/*']
    ignore:
      # Keep idp-portal aligned with Backstage create-app major pins. Bumping
      # these outside the template ranges breaks the portal until Backstage
      # itself ships a compatible upgrade.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/jest-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@testing-library/react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'cross-env'
        update-types: ['version-update:semver-major']
      - dependency-name: 'better-sqlite3'
        update-types: ['version-update:semver-major']

  - package-ecosystem: terraform
    # No .tf files live directly in /infrastructure-modules — every module is
    # two levels down (e.g. aws/vpc, gcp/gke). `directory` doesn't recurse,
    # so the updater found nothing here; `directories` does glob-expand.
    directories:
      - /infrastructure-modules/*/*
    schedule:
      interval: weekly
    labels: [dependencies, infrastructure]

  - package-ecosystem: gomod
    directory: /golden-paths/go-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: docker
    directory: /golden-paths/go-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]

  - package-ecosystem: docker
    directory: /golden-paths/nodejs-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Standardized on Node 24 LTS.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /golden-paths/python-fastapi-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Standardized on Python 3.13.
      - dependency-name: 'python'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /golden-paths/static-site/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Golden path templates are pinned to vitest 2.x.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # Toolchain majors aren't covered by any CI that actually installs and
      # builds this skeleton, so a green Dependabot check proves nothing.
      # Bump these deliberately, not via auto-PR.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /golden-paths/nodejs-service/skeleton
    schedule:
      interval: weekly
    labels: [dependencies, golden-path]
    ignore:
      # Golden path templates are pinned to vitest 2.x.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
      # Toolchain majors aren't covered by any CI that actually installs and
      # builds this skeleton, so a green Dependabot check proves nothing.
      # Bump these deliberately, not via auto-PR.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pino'
        update-types: ['version-update:semver-major']
      - dependency-name: 'pino-http'
        update-types: ['version-update:semver-major']
      # @types/node should track the pinned Node major below (docker
      # ecosystem block: standardized on Node 24 LTS), not float ahead of the
      # runtime it describes.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
