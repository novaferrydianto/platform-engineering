name: Setup OpenTofu and Terragrunt
description: Installs pinned OpenTofu and Terragrunt versions for infrastructure workflows

inputs:
  tofu-version:
    description: OpenTofu version
    required: false
    default: '1.12.5'
  terragrunt-version:
    description: Terragrunt version
    required: false
    default: '1.1.3'

runs:
  using: composite
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      with:
        tofu_version: ${{ inputs.tofu-version }}
        # The wrapper rewrites stdout, which breaks parsing plan output downstream.
        tofu_wrapper: false

    - name: Install Terragrunt
      shell: bash
      env:
        TG_VERSION: ${{ inputs.terragrunt-version }}
      run: |
        set -euo pipefail
        url="https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
        curl -sSfL "$url" -o /tmp/terragrunt
        curl -sSfL "${url}.sha256sum" -o /tmp/terragrunt.sha256sum
        # Release checksum files list the asset name; verify against the downloaded file.
        echo "$(cut -d' ' -f1 /tmp/terragrunt.sha256sum)  /tmp/terragrunt" | sha256sum -c -
        chmod +x /tmp/terragrunt
        sudo mv /tmp/terragrunt /usr/local/bin/terragrunt
        terragrunt --version
