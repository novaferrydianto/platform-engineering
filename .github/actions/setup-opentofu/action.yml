name: Setup OpenTofu and Terragrunt
description: Installs pinned OpenTofu and Terragrunt versions for infrastructure workflows

inputs:
  tofu-version:
    description: OpenTofu version
    required: false
    default: '1.12.5'
  terragrunt-version:
    description: Terragrunt version
    required: false
    default: '1.1.3'

runs:
  using: composite
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      with:
        tofu_version: ${{ inputs.tofu-version }}
        # The wrapper rewrites stdout, which breaks parsing plan output downstream.
        tofu_wrapper: false

    - name: Install Terragrunt
      shell: bash
      env:
        TG_VERSION: ${{ inputs.terragrunt-version }}
      run: |
        set -euo pipefail
        base="https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}"
        curl -sSfL "${base}/terragrunt_linux_amd64" -o /tmp/terragrunt
        # Terragrunt publishes one combined SHA256SUMS for the release, not a
        # per-asset .sha256sum file. Pull our asset's line out of it.
        curl -sSfL "${base}/SHA256SUMS" -o /tmp/terragrunt.SHA256SUMS
        expected="$(awk '$2 == "terragrunt_linux_amd64" {print $1}' /tmp/terragrunt.SHA256SUMS)"
        if [ -z "$expected" ]; then
          echo "::error::terragrunt_linux_amd64 not listed in SHA256SUMS for v${TG_VERSION}"
          exit 1
        fi
        echo "${expected}  /tmp/terragrunt" | sha256sum -c -
        chmod +x /tmp/terragrunt
        sudo mv /tmp/terragrunt /usr/local/bin/terragrunt
        terragrunt --version
