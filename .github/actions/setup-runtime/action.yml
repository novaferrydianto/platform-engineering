name: Setup runtime
description: Installs and caches the language runtime and dependencies for a scaffolded service

inputs:
  language:
    description: node | python | go | static
    required: true
  node-version:
    description: Node.js version (node/static only)
    required: false
    default: '24'
  python-version:
    description: Python version (python only)
    required: false
    default: '3.13'
  go-version:
    description: Go version (go only)
    required: false
    default: '1.26'
  install:
    description: Whether to install project dependencies
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.language == 'node' || inputs.language == 'static'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install Node dependencies
      if: (inputs.language == 'node' || inputs.language == 'static') && inputs.install == 'true'
      shell: bash
      # `npm ci` requires a lockfile; scaffolded repos get one on first install.
      run: |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi

    - name: Setup Python
      if: inputs.language == 'python'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      if: inputs.language == 'python'
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      with:
        enable-cache: true

    - name: Install Python dependencies
      if: inputs.language == 'python' && inputs.install == 'true'
      shell: bash
      run: uv sync --all-groups

    - name: Setup Go
      if: inputs.language == 'go'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - name: Download Go dependencies
      if: inputs.language == 'go' && inputs.install == 'true'
      shell: bash
      run: go mod download
