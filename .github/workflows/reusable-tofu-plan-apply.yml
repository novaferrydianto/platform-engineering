name: Reusable OpenTofu plan and apply

# Plan runs on pull requests and posts the diff. Apply runs only on the default
# branch and goes through a GitHub Environment with required reviewers — dev,
# staging and prod all pause for manual approval before anything is applied.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terragrunt unit or stack directory
        type: string
        required: true
      environment:
        description: dev | staging | prod
        type: string
        required: true
      cloud:
        description: aws | gcp | azure
        type: string
        required: true
      apply:
        description: Apply the plan (otherwise plan-only)
        type: boolean
        required: false
        default: false
      run-all:
        description: Operate on every unit beneath working-directory
        type: boolean
        required: false
        default: false
      tofu-version:
        type: string
        required: false
        default: '1.12.5'
      terragrunt-version:
        type: string
        required: false
        default: '1.1.3'
      runs-on:
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  plan:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: novaferrydianto/platform-engineering/.github/actions/setup-opentofu@main
        with:
          tofu-version: ${{ inputs.tofu-version }}
          terragrunt-version: ${{ inputs.terragrunt-version }}

      - uses: novaferrydianto/platform-engineering/.github/actions/cloud-login@main
        with:
          cloud: ${{ inputs.cloud }}
          aws-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Format check
        run: terragrunt hcl fmt --check --diff

      - name: Validate
        run: terragrunt ${{ inputs.run-all && 'run --all' || 'run' }} -- validate

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          terragrunt ${{ inputs.run-all && 'run --all' || 'run' }} -- plan -no-color -out=tfplan | tee plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_DIR: ${{ inputs.working-directory }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync(`${process.env.PLAN_DIR}/plan.txt`, 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... truncated' : plan;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### OpenTofu plan — \`${process.env.PLAN_DIR}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${truncated}\n\`\`\`\n\n</details>`,
            });

      - name: Upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}/**/tfplan
          retention-days: 5

  apply:
    if: inputs.apply && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [plan]
    runs-on: ${{ inputs.runs-on }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: novaferrydianto/platform-engineering/.github/actions/setup-opentofu@main
        with:
          tofu-version: ${{ inputs.tofu-version }}
          terragrunt-version: ${{ inputs.terragrunt-version }}

      - uses: novaferrydianto/platform-engineering/.github/actions/cloud-login@main
        with:
          cloud: ${{ inputs.cloud }}
          aws-role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}

      # Applies the reviewed plan file, so what was approved is exactly what runs.
      - name: Apply
        run: terragrunt ${{ inputs.run-all && 'run --all' || 'run' }} -- apply tfplan
