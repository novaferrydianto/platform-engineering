name: Platform CI

# The platform repo validates itself with the same rigour it imposes on the
# services it scaffolds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Action pinning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every action must be pinned to a commit SHA
        run: bash scripts/check-action-pins.sh

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  infrastructure:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-opentofu

      - name: Format check
        run: tofu fmt -check -recursive infrastructure-modules

      - name: Validate every module
        run: |
          set -euo pipefail
          failed=0
          for dir in infrastructure-modules/*/*/; do
            echo "::group::$dir"
            # -backend=false: modules are pure and hold no state of their own.
            if ! (cd "$dir" && tofu init -backend=false -input=false >/dev/null && tofu validate); then
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Terragrunt format check
        run: terragrunt hcl fmt --check --diff --working-dir provisioning/live

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Public repos do not need a license. For private orgs, set
          # GITLEAKS_LICENSE as a normal Actions secret *and* as a Dependabot
          # secret — Dependabot PRs cannot read ordinary Actions secrets.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Checkov
        uses: bridgecrewio/checkov-action@1246d92f57abae29d5db5f9aeeed2a9813e52d7d # v12
        with:
          directory: .
          # Frameworks and the documented skip list both live in .checkov.yml,
          # so a suppression is a reviewed change to a file with reasons in it
          # rather than a flag buried in workflow YAML.
          config_file: .checkov.yml
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload results
        if: always() && hashFiles('checkov.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: checkov.sarif
          category: checkov

  golden-paths:
    name: Golden path templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate template schema and skeleton wiring
        run: python3 scripts/validate-golden-paths.py

  cost:
    name: Cost estimate
    # Requires an INFRACOST_API_KEY secret. Gated on a repository variable so a
    # fork without that secret gets a skipped job rather than a hard failure.
    # Dependabot PRs cannot access ordinary Actions secrets, so skip them too.
    if: >
      github.event_name == 'pull_request' &&
      vars.INFRACOST_ENABLED == 'true' &&
      github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/reusable-cost-estimate.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      # Prices the Terragrunt units that actually instantiate resources.
      # infrastructure-modules/ holds pure modules with no inputs bound, so
      # there is nothing there to price.
      working-directory: provisioning/live
    secrets:
      infracost-api-key: ${{ secrets.INFRACOST_API_KEY }}
