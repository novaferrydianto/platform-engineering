name: Reusable security scan

# Four gates on every PR: secrets, dependencies, static analysis, and IaC.
# Findings at or above `fail-on-severity` fail the build.

on:
  workflow_call:
    inputs:
      language:
        description: node | python | go
        type: string
        required: true
      fail-on-severity:
        description: critical | high | medium | low
        type: string
        required: false
        default: high
      scan-iac:
        description: Scan Terraform/OpenTofu, Helm, and Kubernetes manifests
        type: boolean
        required: false
        default: true
      runs-on:
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencies:
    name: Dependency scan
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Pin the scanner binary too — the action only wraps it, so an
          # unpinned trivy is an unpinned dependency in the build.
          version: v0.74.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.fail-on-severity == 'critical' && 'CRITICAL' || inputs.fail-on-severity == 'high' && 'CRITICAL,HIGH' || inputs.fail-on-severity == 'medium' && 'CRITICAL,HIGH,MEDIUM' || 'CRITICAL,HIGH,MEDIUM,LOW' }}
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload results
        if: always() && hashFiles('trivy-fs.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  sast:
    name: Static analysis
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ inputs.language == 'python' && 'python' || inputs.language == 'go' && 'go' || 'javascript-typescript' }}
          queries: security-extended
          token: ${{ github.token }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: codeql-${{ inputs.language }}

  iac:
    name: IaC and manifest scan
    if: inputs.scan-iac
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkov
        uses: bridgecrewio/checkov-action@3be6be7935e32c4c683b1d40622aa43a7c8bbcaa # v12
        with:
          directory: .
          # No config_file here: a generated service repo has no .checkov.yml of
          # its own. Suppressions a service needs go inline, next to the code
          # they excuse, where a reviewer sees them.
          framework: terraform,helm,kubernetes,dockerfile,github_actions
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload results
        if: always() && hashFiles('checkov.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: checkov.sarif
          category: checkov
