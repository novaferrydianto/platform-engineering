name: Reusable static site deploy

on:
  workflow_call:
    inputs:
      site-name:
        type: string
        required: true
      cloud:
        description: aws | gcp | azure
        type: string
        required: true
      environment:
        type: string
        required: true
      artifact-name:
        description: Build artifact uploaded by reusable-build.yml
        type: string
        required: false
        default: dist
      runs-on:
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ${{ inputs.runs-on }}
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - uses: novaferrydianto/platform-engineering/.github/actions/cloud-login@main
        with:
          cloud: ${{ inputs.cloud }}
          aws-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          gcp-workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp-service-account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Hashed assets are immutable and long-cached; index.html must revalidate so a
      # deploy is visible immediately.
      - name: Sync to object storage
        env:
          BUCKET: ${{ inputs.site-name }}-${{ inputs.environment }}
          # Interpolated into env rather than into the script body: a `${{ }}`
          # expanded directly inside `run:` is substituted before the shell sees
          # it, so any value containing shell syntax executes.
          CLOUD: ${{ inputs.cloud }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          set -euo pipefail
          case "$CLOUD" in
            aws)
              aws s3 sync dist/ "s3://$BUCKET/" --delete \
                --exclude index.html --cache-control "public,max-age=31536000,immutable"
              aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
                --cache-control "public,max-age=0,must-revalidate"
              ;;
            gcp)
              gcloud storage rsync dist/ "gs://$BUCKET/" --recursive --delete-unmatched-destination-objects
              gcloud storage objects update "gs://$BUCKET/**" --cache-control "public,max-age=31536000,immutable"
              gcloud storage objects update "gs://$BUCKET/index.html" --cache-control "public,max-age=0,must-revalidate"
              ;;
            azure)
              # '$web' is the literal container name Azure uses for static site
              # hosting — it must not expand, so the single quotes are correct.
              # shellcheck disable=SC2016
              az storage blob upload-batch --destination '$web' --source dist \
                --account-name "$AZURE_STORAGE_ACCOUNT" --overwrite --auth-mode login
              ;;
          esac

      - name: Invalidate CDN cache
        env:
          CLOUD: ${{ inputs.cloud }}
          SITE_NAME: ${{ inputs.site-name }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          GCP_URL_MAP: ${{ vars.GCP_URL_MAP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FRONTDOOR_PROFILE: ${{ vars.AZURE_FRONTDOOR_PROFILE }}
        run: |
          set -euo pipefail
          case "$CLOUD" in
            aws)
              aws cloudfront create-invalidation \
                --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
              ;;
            gcp)
              gcloud compute url-maps invalidate-cdn-cache "$GCP_URL_MAP" --path "/*" --async
              ;;
            azure)
              az afd endpoint purge --resource-group "$AZURE_RESOURCE_GROUP" \
                --profile-name "$AZURE_FRONTDOOR_PROFILE" \
                --endpoint-name "$SITE_NAME" --content-paths "/*"
              ;;
          esac
