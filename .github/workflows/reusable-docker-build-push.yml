name: Reusable container build and push

# Builds, scans, signs, and publishes a container image.
# Auth is OIDC-only — no registry passwords are stored in caller repos.

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
      registry:
        type: string
        required: false
        default: ghcr.io
      context:
        type: string
        required: false
        default: .
      dockerfile:
        type: string
        required: false
        default: Dockerfile
      platforms:
        type: string
        required: false
        default: linux/amd64
      fail-on-severity:
        description: Image vulnerability severity that fails the build
        type: string
        required: false
        default: high
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
    outputs:
      image-tag:
        description: Immutable tag published for this commit
        value: ${{ jobs.build.outputs.image-tag }}
      image-digest:
        description: Image digest, for deployment by digest rather than tag
        value: ${{ jobs.build.outputs.image-digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing + registry OIDC
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}
          # Immutable, commit-addressable tags. `latest` is deliberately absent —
          # deployments must reference a specific build.
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}
          severity: ${{ inputs.fail-on-severity == 'critical' && 'CRITICAL' || inputs.fail-on-severity == 'high' && 'CRITICAL,HIGH' || 'CRITICAL,HIGH,MEDIUM' }}
          exit-code: '1'
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Generate SBOM attestation
        env:
          IMAGE: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign download sbom "$IMAGE" > sbom.spdx.json || echo "::warning::no SBOM attached to image"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ inputs.image-name }}
          path: sbom.spdx.json
          if-no-files-found: warn
          retention-days: 30
