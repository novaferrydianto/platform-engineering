apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: static-site
  title: Static Site
  description: |
    Static frontend on the paved road — Vite build, CDN-fronted object storage,
    and CI/CD wired to the platform's reusable workflows.
  tags:
    - recommended
    - frontend
    - static
spec:
  owner: platform-team
  type: website

  parameters:
    - title: Site details
      required: [name, description, owner]
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the site (kebab-case)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          ui:autofocus: true
        description:
          title: Description
          type: string
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        system:
          title: System
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System

    - title: Hosting target
      required: [cloud, environment]
      properties:
        cloud:
          title: Cloud
          type: string
          description: CDN and object storage backend
          enum: [aws, gcp, azure]
          enumNames: ['AWS (S3 + CloudFront)', 'Google Cloud (GCS + Cloud CDN)', 'Azure (Blob + Front Door)']
          default: aws
        environment:
          title: Initial environment
          type: string
          enum: [dev, staging, prod]
          default: dev
        customDomain:
          title: Custom domain
          type: string
          description: Optional — leave blank to use the CDN default hostname
          pattern: '^$|^([a-z0-9-]+\.)+[a-z]{2,}$'

    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: Repository location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]

  steps:
    - id: fetch
      name: Render site skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
          cloud: ${{ parameters.cloud }}
          environment: ${{ parameters.environment }}
          customDomain: ${{ parameters.customDomain }}
          repoUrl: ${{ parameters.repoUrl }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        deleteBranchOnMerge: true
        requireCodeOwnerReviews: true
        requiredApprovingReviewCount: 1
        protectDefaultBranch: true

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
